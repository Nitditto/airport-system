# =============================================================================
# Airline Microservices — full stack
# =============================================================================
# Build image BE trước (chạy ở thư mục này):
#   mvn package jib:dockerBuild -DskipTests   (phải là package: compile không đóng gói common-lib vào image)
#
# Biến bí mật (JWT_SECRET, RAZORPAY_*...) lấy từ file .env cùng thư mục.
#
#   docker compose up -d                  # MySQL + Eureka + Gateway + 9 service BE
#   docker compose --profile full up -d --build   # thêm frontend (build từ ../frontend)
#
# Dev FE thường chạy `npm run dev` trên máy host (HMR) và gọi gateway :5000, không cần profile full.
#
# config-server (8888) chỉ nằm trong mạng compose.
# Publish ra host: api-gateway (5000), service-registry (8761), mysql (3307), kafka (9092, chỉ 127.0.0.1),
# và frontend (5173) khi bật profile full. Nginx của frontend proxy /auth, /api sang gateway.
# =============================================================================

name: airline

x-business-service: &business-service
  restart: unless-stopped
  networks: [airline]

x-eureka: &eureka
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

x-config: &config
  # Trong compose config-server là bắt buộc: CONFIG_IMPORT_MODE rỗng bỏ tiền tố "optional:" của spring.config.import
  # nên service không khởi động nếu chưa có config-server (restart policy sẽ thử lại). Không dùng SPRING_CONFIG_IMPORT:
  # import khai báo qua biến môi trường chạy trước application.yaml, lúc đó chưa biết spring.application.name.
  CONFIG_IMPORT_MODE: ""
  CONFIG_SERVER_URL: http://config-server:8888

x-kafka: &kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # listener INTERNAL, dành cho container trong mạng compose

x-depends: &depends
  mysql:
    condition: service_healthy
  service-registry:
    condition: service_started
  config-server:
    condition: service_healthy

services:

  mysql:
    image: mysql:8.4
    container_name: airline-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "127.0.0.1:3307:3306"   # 3307 để không đụng MySQL cài sẵn trên máy
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [airline]

  # Kafka KRaft một node (broker + controller, không cần ZooKeeper).
  # Hai listener: container gọi kafka:29092 (INTERNAL), app chạy trên máy host gọi localhost:9092 (EXTERNAL).
  # Dữ liệu lưu ở volume kafka-data (/var/lib/kafka/data), sống sót qua `down`; `down -v` sẽ xoá.
  kafka:
    image: apache/kafka:4.1.1
    container_name: airline-kafka
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [airline]

  # Cache cho location-service (Airport/City). Không publish ra host, không cần volume (mất cache chỉ chậm hơn).
  redis:
    image: redis:7-alpine
    container_name: airline-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [airline]

  service-registry:
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/service-registry:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks: [airline]

  # Config server (native): phục vụ thư mục ./config-repo. Không publish ra host (chỉ container trong mạng compose).
  # Sửa file trong config-repo rồi restart service liên quan để nhận cấu hình mới (chưa có refresh runtime).
  config-server:
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/config-server:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-config-server
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    # Image Jib (Ubuntu) không có curl/wget nhưng có bash: gửi GET /actuator/health qua /dev/tcp và chờ "UP".
    # Service khách chờ condition: service_healthy nên không lao vào kết nối khi JVM chưa lắng nghe cổng 8888.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8888 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [airline]

  api-gateway:
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/api-gateway:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      EUREKA_URL: http://service-registry:8761/eureka/
      <<: *config
    ports:
      - "5000:5000"
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks: [airline]

  user-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/user-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-user-service
    environment:
      <<: [*eureka, *config]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on: *depends

  airline-core-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/airline-core-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-core-service
    environment:
      <<: [*eureka, *config]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  flight-ops-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/flight-ops-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-flight-ops-service
    environment:
      <<: [*eureka, *config, *kafka]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_flight
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  location-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/location-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-location-service
    environment:
      <<: [*eureka, *config]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_location
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      <<: *depends
      redis:
        condition: service_started   # không chờ healthy: service vẫn chạy được khi Redis chết (CacheErrorHandler)

  pricing-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/pricing-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-pricing-service
    environment:
      <<: [*eureka, *config]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_pricing
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  seat-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/seat-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-seat-service
    environment:
      <<: [*eureka, *config, *kafka]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_seat
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  ancillary-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/ancillary-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-ancillary-service
    environment:
      <<: [*eureka, *config]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_ancillary
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  booking-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/booking-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-booking-service
    environment:
      <<: [*eureka, *config, *kafka]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_booking
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    depends_on: *depends

  payment-service:
    <<: *business-service
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/payment-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-payment-service
    environment:
      <<: [*eureka, *config, *kafka]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airline_payment
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CALLBACK_BASE_URL: ${RAZORPAY_CALLBACK_BASE_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      # Để trống = tắt VNPay (payment-service vẫn chạy, Razorpay không bị ảnh hưởng); điền vào .env để bật.
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:${FRONTEND_PORT:-5173}/payment/result}
    depends_on: *depends

  frontend:
    profiles: ["full"]   # chỉ chạy khi có --profile full
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ENABLE_BACKEND_SHIMS: ${VITE_ENABLE_BACKEND_SHIMS:-true}
        VITE_BOOKING_HOLD_MINUTES: ${VITE_BOOKING_HOLD_MINUTES:-15}
    image: ${DOCKER_IMAGE_PREFIX:-nitditto}/frontend:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: airline-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks: [airline]

volumes:
  mysql-data:
  kafka-data:

networks:
  airline:
