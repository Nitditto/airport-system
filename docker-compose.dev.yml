# =============================================================================
# DEV INFRASTRUCTURE ONLY — chỉ MySQL, publish ra localhost:3306.
# Dùng khi chạy các service từ IDE (application.yaml trỏ jdbc:mysql://localhost:3306,
# user root / password 123456, Eureka chạy từ IDE ở localhost:8761).
# BE không dùng Redis / Kafka / Config Server nên không cần container cho chúng.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
# =============================================================================

name: airline-dev

services:

  mysql:
    image: mysql:8.4
    container_name: airline-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-dev-data:
