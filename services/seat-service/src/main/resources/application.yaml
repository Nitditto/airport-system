server:
  port: 5006

spring:
  application:
    name: seat-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_seat
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# Thời gian giữ ghế tạm thời (phút), khớp với thời hạn link thanh toán 15 phút.
seat:
  hold:
    ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:15}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true