server:
  port: 5006

spring:
  config:
    import: "${CONFIG_IMPORT_MODE:optional:}configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: seat-service

  # Mặc định Spring là 2000: một trang lớn kéo theo batch-by-ids > 200 id ở service khác. Vượt -> kẹp về 100.
  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:mysql://localhost:3306/airline_seat
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.nitditto.payload.event"
    listener:
      concurrency: 3

# Thời gian giữ ghế tạm thời (phút). PHẢI lớn hơn booking.payment-window-minutes (booking-service, mặc định 15):
# hold bắt đầu ngay TRƯỚC khi booking được tạo, nên TTL bằng đúng hạn thanh toán sẽ hết sớm hơn vài giây và ghế có thể
# bị người khác lấy khi khách vẫn còn được trả tiền. Đệm 2 phút. Đổi một bên thì đổi cả bên kia.
seat:
  hold:
    ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:17}
  # Phụ thu chọn chỗ mặc định (seat fee, KHÔNG phải giá vé). Ghế mẫu có premiumSuperCharge riêng sẽ dùng giá riêng.
  pricing:
    default-window-surcharge: ${SEAT_DEFAULT_WINDOW_SURCHARGE:1000.0}
    default-aisle-surcharge: ${SEAT_DEFAULT_AISLE_SURCHARGE:500.0}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Tên topic (CLAUDE.md §9: <domain>.<entity>.<action>, khai ở yaml).
kafka:
  topics:
    flight-instance-created: flight.instance.created
