server:
  port: 5006

spring:
  application:
    name: seat-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_seat
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: seat-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.nitditto.event,com.nitditto.*"
    listener:
      concurrency: 3

# Thời gian giữ ghế tạm thời (phút), khớp với thời hạn link thanh toán 15 phút.
seat:
  hold:
    ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:15}
  # Phụ thu chọn chỗ mặc định (seat fee, KHÔNG phải giá vé). Ghế mẫu có premiumSuperCharge riêng sẽ dùng giá riêng.
  pricing:
    default-window-surcharge: ${SEAT_DEFAULT_WINDOW_SURCHARGE:1000.0}
    default-aisle-surcharge: ${SEAT_DEFAULT_AISLE_SURCHARGE:500.0}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
