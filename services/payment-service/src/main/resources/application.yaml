server:
  port: 5010

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../../.env[.properties]"

  application:
    name: payment-service

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/airline_payment
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

razorpay:
  api:
    key: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  callback:
    base-url: ${RAZORPAY_CALLBACK_BASE_URL:http://localhost:5173}

vnpay:
  # để trống = tắt VNPay: service vẫn khởi động, nhưng tạo link/xác thực chữ ký VNPay sẽ bị từ chối
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
