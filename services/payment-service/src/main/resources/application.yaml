server:
  port: 5010

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../../.env[.properties]"

  application:
    name: payment-service

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
      # Gọi confirm-payment chạy trên thread request /verify (sau commit): timeout ngắn để không treo người dùng.
      client:
        config:
          booking-service:
            connect-timeout: 2000
            read-timeout: 5000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}

  datasource:
    url: jdbc:mysql://localhost:3306/airline_payment
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true


razorpay:
  api:
    key: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  callback:
    base-url: ${RAZORPAY_CALLBACK_BASE_URL:http://localhost:5173}

vnpay:
  # để trống = tắt VNPay: service vẫn khởi động, nhưng tạo link/xác thực chữ ký VNPay sẽ bị từ chối
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
  # API hoàn tiền (merchant_webapi). Sandbox hạn chế hoàn tiền: cần VNPay mở cho merchant mới dùng được.
  refund-url: ${VNPAY_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  # Kiểm tra chữ ký phản hồi hoàn tiền; tắt (false) nếu định dạng thực tế của VNPay khác tài liệu và đã đối chiếu thủ công.
  refund-verify-response: ${VNPAY_REFUND_VERIFY_RESPONSE:true}
  # API tra cứu giao dịch (querydr), cùng endpoint merchant_webapi với hoàn tiền.
  query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  query-verify-response: ${VNPAY_QUERY_VERIFY_RESPONSE:true}
  # IPv6 của khách vào vnp_IpAddr: tài liệu VNPay chỉ nêu ví dụ IPv4 nên mặc định tắt (gửi 127.0.0.1 thay thế).
  allow-ipv6-client-ip: ${VNPAY_ALLOW_IPV6_CLIENT_IP:false}

# Tỷ giá VND -> INR cho Razorpay (bảng tỷ giá công khai của Vietcombank). Xem VietcombankExchangeRateService.
fx:
  vietcombank-url: ${FX_RATES_URL:https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx}
  rate-type: ${FX_RATE_TYPE:transfer}          # transfer = mua chuyển khoản (mặc định) | sell = bán ra
  cache-minutes: 60
  max-stale-hours: 24                          # lấy bảng mới lỗi: dùng tỷ giá cũ tối đa chừng này giờ
  fallback-vnd-per-inr: ${FX_FALLBACK_VND_PER_INR:}   # rỗng = không có tỷ giá dự phòng (lỗi thì từ chối Razorpay)
  margin-percent: ${FX_MARGIN_PERCENT:1.0}            # biên an toàn cộng vào số INR thu (bù trượt giá), 0-50
  max-change-percent: 20                       # tỷ giá mới lệch quá mức này so với tỷ giá đang dùng bị bỏ qua

# Job đối soát payment VNPay còn PENDING (xem PendingPaymentReconciler).
payment:
  reconcile:
    enabled: ${PAYMENT_RECONCILE_ENABLED:true}
    interval-ms: 120000
    min-age-minutes: 2
    requery-interval-minutes: 5
    max-age-hours: 48
    batch-size: 50

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Tên topic (CLAUDE.md §9: <domain>.<entity>.<action>, khai ở yaml).
kafka:
  topics:
    payment-transaction-succeeded: payment.transaction.succeeded
    payment-transaction-failed: payment.transaction.failed
