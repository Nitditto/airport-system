server:
  port: 5010

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../../.env[.properties]"

  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_payment
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

razorpay:
  api:
    key: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  callback:
    base-url: ${RAZORPAY_CALLBACK_BASE_URL:http://localhost:5173}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
