server:
  port: 5001

jwt:
  secret: ${JWT_SECRET}
  # Thời hạn JWT (phút). Token chưa thu hồi được, nên càng ngắn càng ít rủi ro khi bị lộ. Mặc định 24 giờ như trước.
  ttl-minutes: ${JWT_TTL_MINUTES:1440}

app:
  admin:
    # để trống = không seed tài khoản admin
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../../.env[.properties]"
      - "${CONFIG_IMPORT_MODE:optional:}configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: user-service
  # Mặc định Spring là 2000: một trang lớn kéo theo batch-by-ids > 200 id ở service khác. Vượt -> kẹp về 100.
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:mysql://localhost:3306/airline_user
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
