server:
  port: 5001
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/airline_user
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
