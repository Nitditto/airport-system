server:
  port: 5003
spring:
  application:
    name: flight-ops-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_flight
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}

# Tên topic (CLAUDE.md §9: <domain>.<entity>.<action>, khai ở yaml, không hardcode trong code).
kafka:
  topics:
    flight-instance-created: flight.instance.created

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
