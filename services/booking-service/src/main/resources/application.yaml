server:
  port: 5009

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_booking
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# Thời hạn thanh toán cho booking PENDING (khớp thời hạn giữ ghế và link VNPay 15 phút).
booking:
  payment-window-minutes: ${BOOKING_PAYMENT_WINDOW_MINUTES:15}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
