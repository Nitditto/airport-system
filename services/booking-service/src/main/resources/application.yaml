server:
  port: 5009

spring:
  config:
    import: "${CONFIG_IMPORT_MODE:optional:}configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_booking
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.nitditto.payload.event"
    listener:
      concurrency: 3

# Thời hạn thanh toán cho booking PENDING (khớp thời hạn giữ ghế và link VNPay 15 phút).
booking:
  payment-window-minutes: ${BOOKING_PAYMENT_WINDOW_MINUTES:15}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Tên topic (CLAUDE.md §9: <domain>.<entity>.<action>, khai ở yaml).
kafka:
  topics:
    payment-transaction-succeeded: payment.transaction.succeeded
    payment-transaction-failed: payment.transaction.failed
