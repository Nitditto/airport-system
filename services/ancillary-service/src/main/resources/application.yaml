server:
  port: 5008

spring:
  config:
    import: "${CONFIG_IMPORT_MODE:optional:}configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: ancillary-service

  # Mặc định Spring là 2000: một trang lớn kéo theo batch-by-ids > 200 id ở service khác. Vượt -> kẹp về 100.
  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:mysql://localhost:3306/airline_ancillary
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
